name: Task
description: 문서, 설정, 테스트, 리팩토링 등 일반 작업을 등록합니다.
title: "[task] "
labels: ["task"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적
      description: 작업이 필요한 배경과 목표를 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 할 일
      description: 수행할 작업을 체크리스트로 작성해 주세요.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 기준
      description: 완료 여부를 확인할 조건을 작성해 주세요.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 참고 자료
      description: 관련 문서, 링크, 스크린샷 등을 첨부해 주세요.
