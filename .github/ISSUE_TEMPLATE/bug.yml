name: Bug
description: 재현 가능한 오류를 등록합니다.
title: "[Fix] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 오류 설명
      description: 어떤 문제가 발생했는지 명확히 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 오류를 재현할 수 있는 단계를 작성해 주세요.
      value: |
        1. 
        2. 
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상이라면 어떻게 동작해야 하는지 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 스크린샷 및 참고 자료
      description: 가능하다면 오류 화면, 콘솔 메시지, 관련 링크를 첨부해 주세요.
